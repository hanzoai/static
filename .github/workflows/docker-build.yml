name: Docker Build

on:
  push:
    branches: [main]
    tags: ['v*']
  # Without this there is NO way to build on demand, and the push triggers alone
  # are not enough: a push made with a workflow/app token does not start
  # workflows, so a ref pushed by automation (or by the estate's hanzo-dev
  # identity) lands with no run at all — not a failed one, none. v0.5.3 was
  # tagged and reachable from main with no image behind it for exactly that
  # reason, and there was no way to ask for one.
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build (branch or tag, e.g. v0.5.3)
        required: false
        default: main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/static
      # amd64-only: no arm64 arcd runner is registered ([self-hosted,linux,arm64]
      # "spark" is offline), so the default multi-arch build hangs build-arm64
      # forever and create-manifest (needs both arches) never publishes the tag —
      # only the per-arch :X-amd64 lands. The whole hanzo cluster is amd64. Restore
      # "linux/amd64,linux/arm64" once an arm64 runner is back.
      platforms: linux/amd64
    secrets: inherit
