# Build ghcr.io/hanzoai/static and push it. Nothing else.
#
# This exists because the GitHub lane is DEAD: dispatching
# .github/workflows/docker-build.yml answers
#   HTTP 422: Actions has been disabled for this user
# so no push and no manual request can produce an image there. v0.5.3 was
# tagged, merged and reachable from main with no image behind it — and the
# failure is silent, because a disabled Actions account does not create a failed
# run, it creates none at all.
#
# git.hanzo.ai is canonical anyway (the .github one stays until someone confirms
# the account is fixed; it is inert, not harmful). The shape here is the one
# hanzobot/site uses, which is known-good — it is what published site v1.2.5.
name: docker-build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    # Must name a label a runner ACTUALLY advertises. A label nothing offers does
    # not fail — it queues until the 24h timeout, which reads as silence.
    runs-on: [hanzo-build-linux-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Computed in shell so there are no action semantics to guess at. A v* tag
      # publishes the semver verbatim (the App CRs pin `v0.5.1`-style strings, so
      # the v MUST be kept); a main push publishes an immutable sha tag. Never a
      # floating tag — a CR pin has to name one exact image.
      - id: tags
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf 'list<<EOF\nghcr.io/hanzoai/static:%s\nEOF\n' "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            printf 'list<<EOF\nghcr.io/hanzoai/static:sha-%s\nEOF\n' "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        with: { driver: docker-container, driver-opts: network=host }

      # Without this the push is unauthenticated and 403s at the registry.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}

      # build-push-action can exit 0 before the manifest resolves, so a green run
      # could still mean a future ImagePullBackOff. Prove it pulls.
      #
      # QUOTED and read line-by-line: steps.tags.outputs.list is a
      # newline-delimited heredoc (the shape `tags:` wants), so an unquoted
      # expansion pastes a raw newline into the command and bash dies.
      - name: the pushed image resolves
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.tags.outputs.list }}" | while read -r img; do
            [ -n "${img}" ] || continue
            for i in 1 2 3 4 5 6; do
              if docker buildx imagetools inspect "${img}" >/dev/null 2>&1; then
                echo "resolved ${img}"
                break
              fi
              [ "${i}" = 6 ] && { echo "never resolved: ${img}" >&2; exit 1; }
              sleep 10
            done
          done
